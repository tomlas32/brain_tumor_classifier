run_id: bt-exp-002

train:
  data:
    mapping_path: outputs/mappings/latest.json   
  train_in: data/training
  val_in: data/validation      # <<< add this
  val_frac: 0.0                # <<< disable internal split
  image_size: 224
  batch_size: 32
  num_workers: 4
  aug:
    rotate_deg: 15
    hflip_prob: 0.5
    jitter_brightness: 0.1
    jitter_contrast: 0.1

  model:
    name: resnet18
    pretrained: true

  optim:
    lr: 0.001
    weight_decay: 0.0001
    amp: true
    # For your current runner, put scheduler params here (or override via CLI):
    step_size: 10
    gamma: 0.1

  io:
    out_models: models
    out_summary: outputs/training

  loop:
    epochs: 20

  env:
    prefer_cuda: true
    cudnn_deterministic: true
    cudnn_benchmark: false

  callbacks:
    early_stopping:
      enabled: true
      patience: 5
      min_delta: 0.002
      monitor: val_f1
    checkpoint:
      save_best: true
      save_last: false
      every_n_epochs: 0
      # out_dir: models/checkpoints
    lr_logger:
      enabled: true
  run_id: null
  dry_run: false
evaluate:
  data:
    image_size: 224
    eval_in: data/testing        
    batch_size: 32
    num_workers: 4
    seed: 42
  model:
    name: resnet18
    weights_path: models/best.pth   # stable pointer
  io:
    eval_out: outputs/evaluation
    make_galleries: true
    make_gradcam: true
    top_per_class: 6
  run_id: null
  dry_run: false