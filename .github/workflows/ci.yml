name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      DATA_DIR: data
      MODELS_DIR: models
      OUTPUTS_DIR: outputs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: System deps (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_ci.txt

      - name: Create expected dirs
        run: |
          mkdir -p "$DATA_DIR" "$MODELS_DIR" "$OUTPUTS_DIR" .ci/outputs
          echo "DATA_DIR=$DATA_DIR"
          echo "MODELS_DIR=$MODELS_DIR"
          echo "OUTPUTS_DIR=$OUTPUTS_DIR"

      # ---- Pipeline CLI sanity (dry-run only; tolerate missing data) ----
      - name: fetch (dry-run)
        run: |
          python -m src.cli fetch --config src/configs/fetch.yaml --dry-run || true

      - name: merge (dry-run)
        run: |
          python -m src.cli merge --config src/configs/merge.yaml --dry-run || true

      - name: validate (pre, dry-run)
        run: |
          python -m src.pipeline.validate --config src/configs/validate_pre.yaml --dry-run || true

      # cleanup skipped in CI (needs a real pre-validate report)

      - name: resize (dry-run)
        run: |
          python -m src.pipeline.resize --config src/configs/resize.yaml --dry-run || true

      - name: validate (post, dry-run)
        run: |
          python -m src.pipeline.validate --config src/configs/validate_post.yaml --dry-run || true

      - name: split (dry-run)
        run: |
          python -m src.pipeline.split --config src/configs/split.yaml --dry-run || true

      - name: train (dry-run)
        run: |
          python -m src.pipeline.train --config src/configs/train.yaml --dry-run || true

      - name: evaluate (dry-run)
        run: |
          python -m src.pipeline.evaluate --config src/configs/evaluate.yaml --dry-run || true

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Upload artifacts (outputs & logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            .ci/outputs
            outputs
            **/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
